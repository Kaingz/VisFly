# Asymmetric actor-critic: the actor sees "state" only, the critic also "privileged_state"
# (randomised physical parameters and delay).
algorithm:
  policy: CustomMultiInputPolicy
  policy_kwargs:
    ortho_init: False
    log_std_init: -1.0            # initial action noise std 0.37 (actions are in [-1, 1])
    share_features_extractor: False
    pi_features_extractor_class: FlexibleExtractor
    pi_features_extractor_kwargs:
      net_arch:
        state:
          layer: [256]
    vf_features_extractor_class: FlexibleExtractor
    vf_features_extractor_kwargs:
      net_arch:
        state:
          layer: [256]
        privileged_state:
          layer: [64]
    net_arch:
      pi: [256, 128]
      vf: [256, 128]
    activation_fn: ReLU
  verbose: 1
  gamma: 0.99
  n_steps: 128                    # x 1024 drones = 131072 samples per iteration
  batch_size: 8192
  n_epochs: 10
  learning_rate: 3.0e-4
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  device: cuda

learn:
  total_timesteps: 15000000
  checkpoint_freq: 5000000        # environment steps

test:
  is_fig: True
  is_fig_save: True
  is_video: False
  is_video_save: True
  render_kwargs: {}
